<style>
/* Layout: password seal → season header → top-3 boards + stamp rules → "find my card" by exact name; tap a name or card for its sheet */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunken:#E8ECF5; --line:#D6DCEA;
  --fg:#141A2E; --muted:#5F6984;
  --mat:#2148C9; --mat-soft:#DCE4FB;
  --ink:#D9412A; --ink-soft:#FBE3DE;
  --gold:#C98A0E; --gold-soft:#FCEFD2;
  --ok:#1E8A52; --warn:#B26A00;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#161D31; --sunken:#1E2740; --line:#2A3452;
  --fg:#ECF0F9; --muted:#9AA4BF;
  --mat:#7896FF; --mat-soft:#22305A;
  --ink:#FF6E55; --ink-soft:#3D2420;
  --gold:#F2C055; --gold-soft:#3A2F17;
  --ok:#4FC685; --warn:#F0A43C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#161D31; --sunken:#1E2740; --line:#2A3452;
  --fg:#ECF0F9; --muted:#9AA4BF;
  --mat:#7896FF; --mat-soft:#22305A;
  --ink:#FF6E55; --ink-soft:#3D2420;
  --gold:#F2C055; --gold-soft:#3A2F17;
  --ok:#4FC685; --warn:#F0A43C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding:20px 16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible,.card:focus-visible{outline:3px solid var(--mat);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.brand h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
.season{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px}
.season .ring{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.season b{font-family:var(--display);font-weight:400;font-size:18px;display:block;line-height:1.1}
.season span{font-size:12px;color:var(--muted)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* search */
.search{position:relative;flex:1 1 260px;max-width:420px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 42px}
.search input:focus{outline:3px solid var(--mat-soft);border-color:var(--mat)}

.plan{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px}

/* lock */
.lock{min-height:70vh;display:grid;place-items:center}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.lockbox .logo{height:104px;width:auto;margin:4px auto 0;display:block;color:var(--fg)}
.lockbox .wordmark{font-family:"Poppins",var(--body);font-weight:800;letter-spacing:.08em;font-size:18px;margin-top:-4px}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow .mini{height:52px;width:auto;flex:none;color:var(--fg)}
.lockbox h1{font-size:30px}
.lockbox p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:13px;font-weight:600}
.field input{width:100%;font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.field input:focus{outline:3px solid var(--mat-soft);border-color:var(--mat)}
.go{border:0;background:var(--mat);color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{color:var(--ink);font-size:14px;min-height:1.5em;margin:0}

/* finder */
.finder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.finder form{display:flex;gap:8px;flex-wrap:wrap}
.finder .search{flex:1 1 220px;max-width:none}
.finder .go{padding:10px 18px;font-size:15px}
.finder .grid{margin-top:4px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules b{font-family:var(--display);font-weight:400;font-size:16px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}

/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.board h2{font-size:20px;display:flex;align-items:center;gap:8px}
.board h2 svg{flex:none}
.board .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer}
.rank li:hover{background:var(--sunken)}
.rank .no{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.rank li:first-child .no{color:var(--gold)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rank .val{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.rank .val small{font-family:var(--body);font-size:12px;color:var(--muted);margin-left:2px}
.empty{color:var(--muted);font-size:14px;margin:0}

/* kid cards */
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sechead h2{font-size:24px}
.sechead span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;min-width:0;transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card.key{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .name{font-family:var(--display);font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.card .cls{font-size:12px;color:var(--muted)}
.lv{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--mat-soft);color:var(--mat)}
.stamps{display:grid;grid-template-columns:repeat(8,minmax(0,30px));gap:5px;align-items:center}
.st{width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.st.goal{border-color:var(--gold)}
.st.bonus{border-style:dotted}
.st.on{border:2px solid var(--ink);background:var(--ink-soft);color:var(--ink);transform:rotate(-8deg)}
.st.on svg{width:62%;height:62%}
.stamphint{font-size:11px;color:var(--muted);margin-top:-6px}
.keytag{font-size:12px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:4px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.nums div{display:flex;flex-direction:column}
.nums b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.nums span{font-size:11px;color:var(--muted)}
.nums .fire b{color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet{background:var(--surface);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;padding:24px}}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:30px}
.x{border:1px solid var(--line);background:var(--sunken);border-radius:999px;width:36px;height:36px;cursor:pointer;flex:none}
.sheet h3{font-size:17px;margin-bottom:8px}
.trail{display:flex;gap:6px;flex-wrap:wrap}
.trail i{width:26px;height:26px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--muted)}
.trail i.y{background:var(--mat);color:#fff}
.trail i.c{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;background:var(--sunken);border-radius:10px;font-size:14px}
.list li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pass{color:var(--ok);font-weight:600}
.retry{color:var(--warn);font-weight:600}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.statrow div{background:var(--sunken);border-radius:12px;padding:10px 12px}
.statrow b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.statrow span{font-size:12px;color:var(--muted)}
/* yearly keyring board: six 2-month seasons; earned keyrings take the 레벨 업! colors in order */
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:420px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kr{background:var(--sunken);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.kr svg{width:34px;height:34px}
.kr b{font-size:12px;font-weight:600}
.kr span{font-size:11px;color:var(--muted);line-height:1.2}
.kr.now{box-shadow:inset 0 0 0 2px var(--mat)}
.kr.next,.kr.miss{opacity:.45}
.kr.got span{color:var(--ok);font-weight:600}
.yearkeys{font-size:12px;font-weight:600;color:var(--gold)}
.skel{height:150px;border-radius:18px;background:var(--sunken)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
<div class="wrap" id="lockView">
  <div class="lock">
    <form class="lockbox" id="lockForm" autocomplete="off">
      <svg class="logo" viewBox="0 0 1360 2810" role="img" aria-label="ON CENTER"><circle cx="680" cy="600" r="370" fill="none" stroke="currentColor" stroke-width="260"/><circle cx="680" cy="1435" r="185" fill="#FF8A00"/><rect x="200" y="1730" width="270" height="980" rx="135" fill="currentColor"/><rect x="890" y="1730" width="270" height="980" rx="135" fill="currentColor"/><line x1="335" y1="1865" x2="1025" y2="2575" stroke="currentColor" stroke-width="270" stroke-linecap="round"/></svg>
      <div class="wordmark">ON CENTER</div>
      <h1>챌린지 보드</h1>
      <p>센터에서 받은 회원 비밀번호를 입력해 주세요.</p>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" inputmode="text" autocomplete="current-password" required></div>
      <button class="go" id="goBtn" type="submit">들어가기</button>
      <p class="err" id="lockErr" role="alert"></p>
    </form>
  </div>
</div>

<div class="wrap" id="boardView" hidden>
  <div class="top">
    <div class="brandrow"><svg class="mini" viewBox="0 0 1360 2810" role="img" aria-label="ON CENTER"><circle cx="680" cy="600" r="370" fill="none" stroke="currentColor" stroke-width="260"/><circle cx="680" cy="1435" r="185" fill="#FF8A00"/><rect x="200" y="1730" width="270" height="980" rx="135" fill="currentColor"/><rect x="890" y="1730" width="270" height="980" rx="135" fill="currentColor"/><line x1="335" y1="1865" x2="1025" y2="2575" stroke="currentColor" stroke-width="270" stroke-linecap="round"/></svg><div class="brand"><small>ON CENTER KIDS</small><h1>챌린지 보드</h1></div></div>
    <div class="season" id="season"></div>
  </div>
  <div class="status"><span id="asOf"></span><button type="button" class="linkbtn" id="lockBtn">잠그기</button></div>

  <div class="boards">
    <section class="board"><h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4 0-6 1-9z" fill="var(--ink)"/></svg>연속 출석 TOP 3</h2><div class="sub">주 3회·5회를 채우면 이어져요</div><ol class="rank" id="rStreak"></ol></section>
    <section class="board"><h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="var(--ink-soft)" stroke="var(--ink)" stroke-width="2"/><path d="m8 12 3 3 5-6" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>챌린지 성공 TOP 3</h2><div class="sub">최근 6개월 누적 성공 횟수</div><ol class="rank" id="rChal"></ol></section>
    <section class="board"><h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="5" stroke="var(--gold)" stroke-width="2.4"/><path d="m11.5 11.5 8 8M16 16l2-2M18.5 18.5l2-2" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round"/></svg>스탬프 규칙</h2>
      <ul class="rules" id="rules"></ul></section>
  </div>

  <section class="finder">
    <div class="sechead"><h2>내 스탬프 카드 찾기</h2><span>아이의 실제 이름을 정확히 입력하면 카드가 보여요. 보드에는 별명만 표시돼요.</span></div>
    <form id="findForm" autocomplete="off">
      <label class="search" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="아이 이름 (예: 홍길동)" aria-label="아이 이름"></label>
      <button class="go" id="findBtn" type="submit">찾기</button>
    </form>
    <p class="empty" id="findMsg">띄어쓰기는 상관없어요.</p>
    <div class="grid" id="found"></div>
  </section>
</div>

<script>
const DATA = JSON.parse(document.getElementById("board-data").textContent);
const STAMP_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="m6 12.5 4 4 8-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const te = new TextEncoder(), td = new TextDecoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...u));
const norm = s => s.normalize("NFC").replace(/\s+/g, "").toLowerCase();

// ---- crypto (matches build.py: PBKDF2-SHA256 → AES-256-CTR + HMAC-SHA256) ----
async function derive(secret, salt){
  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(salt), iterations: DATA.iter }, base, 640));
  return { enc: bits.slice(0, 32), mac: bits.slice(32, 64), id: bits.slice(64, 80) };
}
async function unseal(box, keys){
  const iv = unb64(box.iv), ct = unb64(box.ct), tag = unb64(box.tag);
  const msg = new Uint8Array(iv.length + ct.length); msg.set(iv); msg.set(ct, iv.length);
  const mk = await crypto.subtle.importKey("raw", keys.mac, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  if (!await crypto.subtle.verify("HMAC", mk, tag, msg)) return null;
  const ek = await crypto.subtle.importKey("raw", keys.enc, "AES-CTR", false, ["decrypt"]);
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-CTR", counter: iv, length: 128 }, ek, ct)));
}

// ---- unlock ----
let password = "", MAIN = null;
// Kept only for this browser tab, so a refresh doesn't ask again.
const store = { get(){ try { return sessionStorage.getItem("oc-pw") || ""; } catch { return ""; } },
  set(pw){ try { sessionStorage.setItem("oc-pw", pw); } catch {} },
  clear(){ try { sessionStorage.removeItem("oc-pw"); localStorage.removeItem("oc-pw"); } catch {} } };
async function unlock(pw, quiet){
  const btn = $("#goBtn"); btn.disabled = true; btn.textContent = "확인하는 중…"; $("#lockErr").textContent = "";
  try {
    if (!DATA || !crypto?.subtle) throw new Error("unsupported");
    const main = await unseal(DATA.main, await derive(pw, DATA.salt));
    if (!main) { if (!quiet) $("#lockErr").textContent = "비밀번호가 맞지 않아요. 센터에 다시 확인해 주세요."; store.clear(); return; }
    password = pw; MAIN = main; store.set(pw); showBoard();
  } catch {
    $("#lockErr").textContent = "이 브라우저에서는 보드를 열 수 없어요. 최신 브라우저로 열어 주세요.";
  } finally { btn.disabled = false; btn.textContent = "들어가기"; }
}
$("#lockForm").addEventListener("submit", e => { e.preventDefault(); const pw = $("#pw").value.trim(); if (pw) unlock(pw); });
$("#lockBtn").addEventListener("click", () => { store.clear(); password = ""; MAIN = null; $("#pw").value = ""; $("#found").innerHTML = ""; $("#q").value = "";
  $("#boardView").hidden = true; $("#lockView").hidden = false; });

// ---- board ----
function showBoard(){
  const asOf = new Date(MAIN.asOf + "T00:00:00");
  const m = asOf.getMonth() + 1, sm = m - ((m - 1) % 2);
  const end = new Date(asOf.getFullYear(), sm + 1, 0);
  const left = Math.round((end - asOf) / 864e5);
  $("#season").innerHTML = `<div class="ring"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="2.4"/><path d="m11.5 11.5 8 8M16 16l2-2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div><div><b>${sm}–${sm+1}월 시즌</b><span>시즌 마감 ${left <= 0 ? "오늘" : "D-" + left} · 스탬프 ${MAIN.goal}개 이상이면 키링</span></div>`;
  $("#asOf").textContent = `${m}월 ${asOf.getDate()}일 기록 기준 · 매일 한 번 업데이트돼요`;
  const rank = (el, list, val, unit, emptyMsg) => {
    $(el).innerHTML = list.length ? list.map((k,i) => `<li data-r="${el}:${i}" tabindex="0"><span class="no">${i+1}</span><span class="nm">${esc(k.name)}</span><span class="val">${val(k)}<small>${unit}</small></span></li>`).join("") : `<p class="empty">${emptyMsg}</p>`;
  };
  rank("#rStreak", MAIN.streak, k => k.streak, "회", "아직 출석 기록이 없어요");
  rank("#rChal", MAIN.wins, k => k.wins, "번", "아직 챌린지 성공 기록이 없어요");
  $("#rules").innerHTML = `<li>주 1회 챌린지에 성공하면 <b>스탬프 1개</b></li><li>한 시즌(2개월)에 <b>최대 ${MAIN.max}개</b>까지 모을 수 있어요</li><li><b>${MAIN.goal}개 이상</b> 모으면 시즌이 끝날 때 챌린지 키링을 받아요</li>`;
  $("#lockView").hidden = true; $("#boardView").hidden = false;
}

function cardHTML(k, i){
  const st = Array.from({length: MAIN.max}, (_,j) => `<span class="st ${j < k.stamps ? "on" : j === MAIN.goal-1 ? "goal" : j >= MAIN.goal ? "bonus" : ""}">${j < k.stamps ? STAMP_SVG : ""}</span>`).join("");
  return `<button type="button" class="card ${k.key ? "key" : ""}" data-f="${i}">
    <div class="row1"><div><div class="name">${esc(k.name)}</div><div class="cls">${esc(k.cls || "반 미정")}${k.planLabel ? `<span class="plan">${esc(k.planLabel)}</span>` : ""}</div></div>${k.lv ? `<span class="lv">${esc(k.lv)}</span>` : ""}</div>
    <div class="stamps" aria-label="스탬프 ${k.stamps}개 / ${MAIN.max}개">${st}</div>
    ${k.key ? `<div class="keytag">키링 확정 · ${k.stamps}/${MAIN.max}</div>` : `<div class="stamphint">키링까지 ${MAIN.goal - k.stamps}개</div>`}
    ${k.yearKeys != null ? `<div class="yearkeys">올해 키링 ${k.yearKeys}/6</div>` : ""}
    <div class="nums"><div class="fire"><b>${k.streak}</b><span>연속 출석</span></div><div><b>${k.wins}</b><span>챌린지 성공</span></div><div><b>${k.monthAll ? k.monthAtt + "/" + k.monthAll : "–"}</b><span>이번 달 출석</span></div></div>
  </button>`;
}
let FOUND = [];
$("#findForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = norm($("#q").value);
  if (!name || !password) return;
  const btn = $("#findBtn"); btn.disabled = true; $("#findMsg").textContent = "찾는 중…"; $("#found").innerHTML = "";
  try {
    const keys = await derive(password + "\u0000" + name, DATA.kidSalt);
    const box = DATA.kids[b64(keys.id)];
    FOUND = box ? (await unseal(box, keys)) || [] : [];
    $("#found").innerHTML = FOUND.map(cardHTML).join("");
    $("#findMsg").textContent = FOUND.length ? "카드를 누르면 자세히 볼 수 있어요." : "그 이름의 카드를 찾지 못했어요. 이름을 정확히 입력했는지 확인해 주세요.";
  } catch { $("#findMsg").textContent = "카드를 여는 중에 문제가 생겼어요. 다시 시도해 주세요."; }
  finally { btn.disabled = false; }
});

// ---- sheet ----
function openSheet(k){
  const trail = k.trail.length ? k.trail.map(([d, a, w]) => `<i class="${a ? "y" : ""} ${w ? "c" : ""}" title="${d}">${Number(d.slice(8))}</i>`).join("") : `<p class="empty">아직 수업 기록이 없어요</p>`;
  const stamps = k.stampList.length ? k.stampList.map(s => `<li><span>${esc(s.what || "챌린지 성공")} · <span class="${s.stamp === false ? "retry" : "pass"}">${s.stamp === false ? "같은 주라 스탬프는 이미 받음" : "스탬프 +1"}</span></span><span>${s.date.slice(5).replace("-", "/")}</span></li>`).join("") : `<li><span>이번 시즌 첫 스탬프를 기다리는 중</span><span></span></li>`;
  const plan = Number((k.planLabel.match(/\d+/) || [0])[0]);
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><div><h2 id="sheetTitle">${esc(k.name)}</h2><div class="cls">${esc(k.cls || "반 미정")}${k.planLabel ? " · " + esc(k.planLabel) : ""}${k.lv ? " · " + esc(k.lv) : ""}</div></div><button class="x" id="closeSheet" type="button" aria-label="닫기">✕</button></header>
    <div class="statrow"><div><b>${k.streak}</b><span>지금 연속 출석</span></div><div><b>${k.best}</b><span>최고 연속 출석</span></div><div><b>${k.stamps}/${MAIN.max}</b><span>이번 시즌 스탬프${k.key ? " · 키링 확정" : ""}</span></div><div><b>${k.wins}</b><span>챌린지 성공 (6개월)</span></div></div>
    ${yearBoard(k)}
    <section><h3>최근 수업</h3><div class="trail">${trail}</div><div class="legend">파란 칸 = 출석 · 빨간 테두리 = 챌린지 성공 · 숫자 = 날짜${plan ? ` · 주 ${plan}회를 채우면 연속 출석이 이어져요` : ""}</div></section>
    <section><h3>이번 시즌 챌린지 성공</h3><div class="legend" style="margin:-4px 0 8px">스탬프는 일주일에 1개씩, 한 시즌 최대 ${MAIN.max}개까지 모여요.</div><ul class="list">${stamps}</ul></section>
    ${k.pastKeys.length ? `<section><h3>지난 시즌 키링</h3><ul class="list">${k.pastKeys.map(se => `<li><span>${Number(se.slice(5))}–${Number(se.slice(5))+1}월 시즌</span><span>${se.slice(0,4)}</span></li>`).join("")}</ul></section>` : ""}
  </div></div>`;
  root.hidden = false; $("#closeSheet").focus();
}
const KEY_FILL = { "흰색": "#F7F7F2", "노랑": "#F5C518", "주황": "#FF8A00", "초록": "#2E9E5B", "파랑": "#2F6FE4", "무지개": "url(#rainbow)" };
function keyIcon(color){
  const fill = color ? KEY_FILL[color] : "none";
  const stroke = color ? "rgba(0,0,0,.35)" : "currentColor";
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A5A"/><stop offset=".25" stop-color="#FFB020"/><stop offset=".5" stop-color="#3CC46B"/><stop offset=".75" stop-color="#3A8BFF"/><stop offset="1" stop-color="#9B5CFF"/></linearGradient></defs>
    <circle cx="20" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".55"/>
    <circle cx="20" cy="25" r="11" fill="${fill}" stroke="${stroke}" stroke-width="${color ? 1.5 : 2.2}" ${color ? "" : 'stroke-dasharray="3 3"'}/>
    ${color ? '<circle cx="20" cy="25" r="3.5" fill="#FF8A00" stroke="rgba(0,0,0,.25)"/>' : ""}</svg>`;
}
function yearBoard(k){
  if (!k.year) return "";
  const yr = MAIN.asOf.slice(0, 4);
  const cells = k.year.map(y => {
    const cls = y.earned ? "got" : y.state === "now" ? "now" : y.state === "next" ? "next" : "miss";
    const note = y.earned ? (y.given ? "받음" : y.state === "now" ? "키링 확정" : "받을 차례") : y.state === "now" ? `${y.stamps}/${MAIN.goal}` : y.state === "next" ? "예정" : `${y.stamps}개`;
    return `<div class="kr ${cls}" title="${y.m}–${y.m + 1}월 스탬프 ${y.stamps}개">${keyIcon(y.earned ? y.color : null)}<b>${y.m}–${y.m + 1}월</b><span>${y.earned ? esc(y.color) + "<br>" : ""}${note}</span></div>`;
  }).join("");
  return `<section><h3>${yr}년 키링 ${k.yearKeys}/6</h3><div class="keys">${cells}</div><div class="legend">시즌마다 스탬프 ${MAIN.goal}개를 모으면 키링! 모은 순서대로 흰색 → 노랑 → 주황 → 초록 → 파랑 → 무지개</div></section>`;
}
function closeSheet(){ const r = $("#sheetRoot"); r.hidden = true; r.innerHTML = ""; }
function pick(t){
  if (t.dataset.f != null) return FOUND[Number(t.dataset.f)];
  const [el, i] = t.dataset.r.split(":"); return (el === "#rStreak" ? MAIN.streak : MAIN.wins)[Number(i)];
}
document.addEventListener("click", e => {
  if (e.target.id === "scrim" || e.target.closest("#closeSheet")) { closeSheet(); return; }
  const t = e.target.closest("[data-f],[data-r]");
  if (t && MAIN) { const k = pick(t); if (k) openSheet(k); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && e.target.matches?.("[data-r]")) { const k = pick(e.target); if (k) openSheet(k); }
});

const saved = store.get();
if (saved) unlock(saved, true);
else $("#pw").focus();
</script>

</body></html>
